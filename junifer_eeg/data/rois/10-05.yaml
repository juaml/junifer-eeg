    waveguard, Brain Products actiCAP, EasyCap, BioSemi ActiveTwo up to 64
    channels, Compumedics Neuroscan Quik-Cap, g.tec g.GAMMAcap, Nexstim eXimia,
    and the clinical 10-20 systems, as Natus, Nihon Kohden or Micromed)
