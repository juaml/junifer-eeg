# ROIs (channel names) of the 10-20 system, and its 10-10 and 10-05 extensions.
# Ported from nice-extensions (nice_ext.equipments.ant,
# brainvision, eximia and gtec):
# Copyright (C) 2017-2018 Federico Raimondo
#
# Each ROI is the 10-05 positions in the region (the convex hull, on the
# topomap) of the union of the ROIs of the ANT 32, BrainVision 32, eximia
# 60 and g.tec 12 caps (the indices of the ANT 63 and 124 ROIs do not
# match their channels). The picks keep the channels in the data.
