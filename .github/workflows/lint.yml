name: Lint

on:
  - push
  - pull_request

# Cancel superseded runs of the same branch / PR, except on main
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Run ruff
        run: uvx "ruff>=0.1.0" check --output-format=github .
      - name: Run codespell
        run: |
          uvx --with tomli codespell --toml pyproject.toml docs/ junifer_eeg/ README.md
