name: Run Tests

on:
  push:
    # Branches are tested through their pull requests
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

# Cancel superseded runs of the same branch / PR, except on main
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Check whether the library changed, to skip the tests otherwise
  # (e.g. on docs-only changes)
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
      - name: Check for library changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'junifer_eeg/**'
              - '.github/workflows/ci.yml'
              - 'tox.ini'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'codecov.yml'

  # The tests
  run-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      # The Python of uv sync and uv run (instead of .python-version)
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install git-annex
        run: |
          sudo apt-get update
          sudo apt-get install -y git-annex
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install Python ${{ matrix.python-version }} and the dependencies
        # The locked dependencies (uv.lock)
        run: |
          uv sync --locked --extra dev
      - name: Configure Git for DataLad
        run: |
          git config --global user.email "junifer-eeg-runner@github.com"
          git config --global user.name "GitHub Runner"
      - name: Run the tests
        run: |
          uv run --locked --extra dev python --version
          uv run --locked --extra dev pytest --cov=junifer_eeg --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: junifer_eeg
        if: success() && matrix.python-version == '3.13'

  # Single status to require in branch protection: passes when the tests
  # passed or were skipped because the library did not change
  tests:
    needs: [changes, run-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "Some test jobs failed or were cancelled"
          exit 1
      - run: echo "Tests passed or were not needed"
