<!doctype html>
<html>
    <head>
        <title>Redirecting to latest version</title>
        <meta charset="utf-8" />
        <meta
            http-equiv="refresh"
            content="0; url=./{{ latest.name if latest else "main" }}/index.html"
        />
        <link rel="canonical" href="./{{ latest.name if latest else "main" }}/index.html" />
    </head>
</html>
