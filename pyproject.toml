[build-system]
requires = ["setuptools>=70", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "junifer_eeg"
description = "Junifer EEG extension"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [
    { name = "Synchon Mandal", email = "s.mandal@fz-juelich.de" },
    { name = "Fede Raimondo", email = "f.raimondo@fz-juelich.de" },
]
maintainers = [
    { name = "Synchon Mandal", email = "s.mandal@fz-juelich.de" },
    { name = "Fede Raimondo", email = "f.raimondo@fz-juelich.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]
dependencies = [
    # The DataReader of the YAML in `junifer run` (juaml/junifer#538)
    "junifer>=0.0.9.dev6",
    "mne>=1.8.0",
    "mffpy>=0.10.0",
    "scikit-learn>=1.3.0",
    "autoreject>=0.4.3",
    "mne-connectivity>=0.7.0",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "pydantic>=2.11.4",
    "lazy_loader>=0.4,<0.7",
    "structlog>=25.0.0,<27.0.0",
]
dynamic = ["version"]

[project.urls]
Source = "https://github.com/juaml/junifer-eeg"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "tox",
    "pre-commit",
    "ruff",
    "towncrier",
]
docs = [
    "sphinx>=7.3.0,<9.0.0",
    "furo>=2024.4.27,<2026.0.0",
    "numpydoc>=1.6.0,<1.12.0",
    "sphinx-copybutton>=0.5.1,<0.5.3",
    "autodoc_pydantic>=2.0.0",
    "myst-parser>=3.0.0",
    # enum-tools fails with Sphinx 9 (see juaml/junifer#519)
    "enum-tools[sphinx]>=0.13.0,<0.14.0",
    "sphinx-polyversion>=2.0.0",
    "sphinx-gallery>=0.17.0,<0.23.0",
    "beautifulsoup4>=4.12.0",
    "setuptools-scm>=8",
]

################
# Tool configs #
################

[tool.setuptools.packages.find]
include = ["junifer_eeg*"]

[tool.setuptools.package-data]
junifer_eeg = ["data/rois/*.yaml"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
write_to = "junifer_eeg/_version.py"

[tool.codespell]
skip = "*/auto_examples/*,*.html,.git/,*.pyc,*/_build/*,uv.lock"
count = ""
quiet-level = 3
ignore-words = "ignore_words.txt"
interactive = 0
builtin = "clear,rare,informal,names,usage,code"

[tool.ruff]
line-length = 79
extend-exclude = [
    "__init__.py",
    "_version.py",
    "docs",
    "examples",
    # Kept as close as possible to the original NICE code
    "junifer_eeg/tests/_nice_reference.py",
]

[tool.ruff.lint]
select = [
    # flake8-bugbear
    "B",
    # flake8-blind-except
    "BLE",
    # flake8-comprehensions
    "C4",
    # mccabe
    "C90",
    # pydocstyle
    "D",
    # pycodestyle errors
    "E",
    # pyflakes
    "F",
    # isort
    "I",
    # pep8-naming
    "N",
    # pygrep-hooks
    "PGH",
    # ruff
    "RUF",
    # flake8-type-checking
    "TCH",
    # pyupgrade
    "UP",
    # pycodestyle warnings
    "W",
    # flake8-2020
    "YTT",
]
ignore = [
    # missing docstring in __init__, incompatible with numpydoc
    "D107",
    # use specific rule codes when ignoring type issues
    "PGH003",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["junifer_eeg"]
known-third-party = [
    "junifer",
    "mne",
    "numpy",
    "scipy",
    "pydantic",
    "structlog",
    "pytest",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = "junifer_eeg"
log_cli_level = "INFO"
xfail_strict = true
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "-vv",
]

[tool.towncrier]
package = "junifer_eeg"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/juaml/junifer-eeg/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/juaml/junifer-eeg/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.coverage.paths]
source = [
    "junifer_eeg",
    "*/site-packages/junifer_eeg",
]

[tool.coverage.run]
branch = true
omit = [
    "*/__init__.py",
    "*/_version.py",
    "*/_cli.py",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Type checking if statements should not be considered
    "if TYPE_CHECKING:",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
]
precision = 2
